name: nightly-verita

on:
  schedule:
    # 1 AM EST = 5 AM UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verita:
    if: github.repository == 'verus-lang/verus'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: checkout verus
        uses: actions/checkout@v6

      - name: setup rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: get z3
        working-directory: ./source
        run: |
          ./tools/get-z3.sh
          echo "z3 version: $(./z3 --version)"

      - name: install singular
        run: |
          sudo apt-get update
          sudo apt-get install -y singular
          echo "Singular version: $(Singular --version || true)"

      - name: build verus with singular support
        working-directory: ./source
        run: |
          cargo clean
          VERUS_SINGULAR_PATH="$(which Singular)" VERUS_Z3_PATH="$(pwd)/z3" cargo build --release --features singular
          cargo run --release -p cargo-verus -- build --release --manifest-path vstd/Cargo.toml

      - name: build verita
        working-directory: ./tools/verita
        run: |
          cargo build --release

      - name: try to download previous results
        id: previous
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: nightly-verita.yml
          name: verita-results
          path: ${{ github.workspace }}/tools/verita/previous-results
          search_artifacts: true
          if_no_artifact_found: warn
          workflow_conclusion: ""

      - name: run verita
        working-directory: ./tools/verita
        run: |
          ./target/release/verita \
            --verus-repo "$GITHUB_WORKSPACE" \
            --label nightly \
            --singular "$(which Singular)" \
            --fail-on-error \
            run_configuration_all.toml

      - name: find output directory
        if: always()
        id: output
        working-directory: ./tools/verita
        run: |
          # verita creates output/<timestamp>-<label>/ — find the most recent one
          OUTPUT_DIR=$(ls -td output/*-nightly | head -1)
          echo "dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Output directory: $OUTPUT_DIR"

      - name: summarize results
        if: always()
        working-directory: ./tools/verita
        run: |
          OUTPUT_DIR="${{ steps.output.outputs.dir }}"

          ARTIFACTS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"

          {
            echo '## Verita Nightly Results'
            echo ''
            echo ":package: [Download full results (verita-results artifact)]($ARTIFACTS_URL)"
            echo ''
            if [ -d previous-results ] && ls previous-results/*.json >/dev/null 2>&1; then
              python scripts/summarize.py --markdown previous-results "$OUTPUT_DIR"
            else
              python scripts/summarize.py --markdown "$OUTPUT_DIR"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verita-results
          path: ${{ github.workspace }}/tools/verita/${{ steps.output.outputs.dir }}
          retention-days: 90

      - name: build failure message
        if: failure()
        id: failure-message
        working-directory: ./tools/verita
        env:
          OUTPUT_DIR: ${{ steps.output.outputs.dir }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED=""
          if [ -n "$OUTPUT_DIR" ] && ls "$OUTPUT_DIR"/*.json >/dev/null 2>&1; then
            FAILED=$(python3 - "$OUTPUT_DIR" <<'PY'
          import glob, json, sys
          names = set()
          for f in glob.glob(sys.argv[1] + "/*.json"):
              runner = json.load(open(f)).get("runner", {})
              if runner.get("success") is False:
                  names.add(runner.get("run_configuration", {}).get("name", f))
          print("\n".join(sorted(names)))
          PY
            )
          fi
          {
            echo 'content<<EOF_MSG'
            echo "The nightly Verita run failed: $RUN_URL"
            if [ -n "$FAILED" ]; then
              echo ''
              echo "**Failed projects ($(echo "$FAILED" | wc -l | tr -d ' ')):**"
              echo "$FAILED" | sed 's/^/- /'
            else
              echo ''
              echo 'No per-project failures were recorded; the run likely failed before or outside verification (e.g., during build).'
            fi
            echo 'EOF_MSG'
          } >> "$GITHUB_OUTPUT"

      - name: notify zulip
        if: failure()
        uses: zulip/github-actions-zulip/send-message@v1
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "github-notifier-bot@verus-lang.zulipchat.com"
          organization-url: "https://verus-lang.zulipchat.com"
          to: "dev"
          type: "stream"
          topic: "Verita failure!"
          content: ${{ steps.failure-message.outputs.content }}
