[package]
name = "mcdc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }

[lib]
name = "mcdc"
path = "src/lib.rs"

[[bin]]
name = "mcdc"
path = "src/main.rs"

[lints]
workspace = true
